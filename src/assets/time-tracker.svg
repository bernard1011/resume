<svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ttg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="72" height="72" rx="16" fill="white" fill-opacity="0.05"/>
  <rect width="72" height="72" rx="16" fill="url(#ttg)"/>
  <rect x="0.75" y="0.75" width="70.5" height="70.5" rx="15.25" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- Clock circle -->
  <circle cx="36" cy="37" r="19" fill="none" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.4"/>
  <circle cx="36" cy="37" r="2.5" fill="#f59e0b" fill-opacity="0.9"/>
  <!-- clock hands -->
  <line x1="36" y1="37" x2="36" y2="23" stroke="#f59e0b" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="37" x2="46" y2="43" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.3" stroke-linecap="round"/>
  <!-- tick marks -->
  <line x1="36" y1="19" x2="36" y2="22" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="36" y1="52" x2="36" y2="55" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="37" x2="21" y2="37" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="51" y1="37" x2="54" y2="37" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>
  <!-- crown on top -->
  <rect x="32" y="15" width="8" height="3.5" rx="1" fill="none" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.2"/>
</svg>